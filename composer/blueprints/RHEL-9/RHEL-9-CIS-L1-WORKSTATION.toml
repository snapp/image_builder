# https://osbuild.org/docs/user-guide/blueprint-reference

version = '1.0.0'

name = 'RHEL-9-CIS-L1-WORKSTATION'

# https://www.cisecurity.org/cis-benchmarks
# https://resources.cisecurity.org/benchmarks
# https://complianceascode.github.io/content-pages/guides/ssg-rhel9-guide-cis_workstation_l1.html
description = '''
Red Hat Enterprise Linux (RHEL) 9
Center for Internet Security® (CIS) Level 1 Workstation
Profile ID:  xccdf_org.ssgproject.content_profile_cis_workstation_l1
Benchmark ID:  xccdf_org.ssgproject.content_benchmark_RHEL-9
'''

distro = 'rhel-9'

[customizations]
partitioning_mode = 'lvm'

[customizations.kernel]
append = ''

[customizations.openscap]
profile_id = 'xccdf_org.ssgproject.content_profile_cis_workstation_l1'

[customizations.services]
enabled = ['crond', 'firewalld', 'systemd-journald']
disabled = ['nftables']
masked = []

[[customizations.disk.partitions]]
type = 'plain'
mountpoint = '/boot'
label = 'boot'
fs_type = 'xfs'
minsize = '1 GiB'

[[customizations.disk.partitions]]
type = 'lvm'
name = 'rootvg'
minsize = '14 GiB'

[[customizations.disk.partitions.logical_volumes]]
name = 'rootlv'
mountpoint = '/'
label = 'root'
fs_type = 'xfs'
minsize = '3 GiB'

[[customizations.disk.partitions.logical_volumes]]
name = 'homelv'
mountpoint = '/home'
label = 'home'
fs_type = 'xfs'
minsize = '1 GiB'

[[customizations.disk.partitions.logical_volumes]]
name = 'tmplv'
mountpoint = '/tmp'
label = 'tmp'
fs_type = 'xfs'
minsize = '1 GiB'

[[customizations.disk.partitions.logical_volumes]]
name = 'varlv'
mountpoint = '/var'
label = 'var'
fs_type = 'xfs'
minsize = '2 GiB'

[[customizations.disk.partitions.logical_volumes]]
name = 'var_loglv'
mountpoint = '/var/log'
label = 'varlog'
fs_type = 'xfs'
minsize = '1 GiB'

[[customizations.disk.partitions.logical_volumes]]
name = 'var_log_auditlv'
mountpoint = '/var/log/audit'
label = 'varlogaudit'
fs_type = 'xfs'
minsize = '1 GiB'

[[customizations.disk.partitions.logical_volumes]]
name = 'var_tmplv'
mountpoint = '/var/tmp'
label = 'vartmp'
fs_type = 'xfs'
minsize = '1 GiB'

[[customizations.disk.partitions.logical_volumes]]
fs_type = 'swap'
minsize = '512 MiB'

# Compliance tooling for Security Content Automation Protocol (SCAP) remediation
[[packages]]
name = 'openscap-scanner'
version = '*'
[[packages]]
name = 'scap-security-guide'
version = '*'

# Identity Management (IdM) tooling
[[packages]]
name = 'ipa-client'
version = '*'
[[packages]]
name = 'oddjob'
version = '*'
[[packages]]
name = 'oddjob-mkhomedir'
version = '*'

# POSIX ACLs for fine-grained file permission control beyond standard ugo/rwx
[[packages]]
name = "acl"
version = "*"

# CCE-90843-4 Filesystem Integrity
[[packages]]
name = 'aide'
version = '*'

# CCE-86760-6 Add journald remote log host support
[[packages]]
name = 'systemd-journal-remote'
version = '*'

# CCE-88164-9 Host-based firewall
[[packages]]
name = 'firewalld'
version = '*'
