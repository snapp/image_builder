# https://osbuild.org/docs/user-guide/blueprint-reference

version = '1.0.0'

name = 'RHEL-9-NIST-HIPAA'

# https://doi.org/10.6028/NIST.SP.800-66r2
# https://complianceascode.github.io/content-pages/guides/ssg-rhel9-guide-hipaa.html
description = '''
Red Hat Enterprise Linux (RHEL) 9
National Institute of Standards and Technology (NIST)
Implementing the Health Insurance Portability and Accountability Act (HIPAA) Security Rule (NIST 800-66)
Profile ID:  xccdf_org.ssgproject.content_profile_hipaa
Benchmark ID:  xccdf_org.ssgproject.content_benchmark_RHEL-9
'''

distro = 'rhel-9'

[customizations]
partitioning_mode = 'lvm'

[customizations.kernel]
append = 'audit=1 audit_backlog_limit=8192'

[customizations.openscap]
profile_id = 'xccdf_org.ssgproject.content_profile_hipaa'

[customizations.services]
enabled = ['auditd', 'crond', 'firewalld']
disabled = ['debug-shell', 'kdump']
masked = []

[[customizations.disk.partitions]]
type = 'plain'
mountpoint = '/boot'
label = 'boot'
fs_type = 'xfs'
minsize = '1 GiB'

[[customizations.disk.partitions]]
type = 'lvm'
name = 'rootvg'
minsize = '14 GiB'

[[customizations.disk.partitions.logical_volumes]]
name = 'rootlv'
mountpoint = '/'
label = 'root'
fs_type = 'xfs'
minsize = '3 GiB'

[[customizations.disk.partitions.logical_volumes]]
name = 'homelv'
mountpoint = '/home'
label = 'home'
fs_type = 'xfs'
minsize = '1 GiB'

[[customizations.disk.partitions.logical_volumes]]
name = 'tmplv'
mountpoint = '/tmp'
label = 'tmp'
fs_type = 'xfs'
minsize = '1 GiB'

[[customizations.disk.partitions.logical_volumes]]
name = 'varlv'
mountpoint = '/var'
label = 'var'
fs_type = 'xfs'
minsize = '2 GiB'

[[customizations.disk.partitions.logical_volumes]]
name = 'var_loglv'
mountpoint = '/var/log'
label = 'varlog'
fs_type = 'xfs'
minsize = '1 GiB'

[[customizations.disk.partitions.logical_volumes]]
name = 'var_log_auditlv'
mountpoint = '/var/log/audit'
label = 'varlogaudit'
fs_type = 'xfs'
minsize = '1 GiB'

[[customizations.disk.partitions.logical_volumes]]
name = 'var_tmplv'
mountpoint = '/var/tmp'
label = 'vartmp'
fs_type = 'xfs'
minsize = '1 GiB'

[[customizations.disk.partitions.logical_volumes]]
fs_type = 'swap'
minsize = '512 MiB'

# Compliance tooling for Security Content Automation Protocol (SCAP) remediation
[[packages]]
name = 'openscap-scanner'
version = '*'
[[packages]]
name = 'scap-security-guide'
version = '*'

# Identity Management (IdM) tooling
[[packages]]
name = 'ipa-client'
version = '*'
[[packages]]
name = 'oddjob'
version = '*'
[[packages]]
name = 'oddjob-mkhomedir'
version = '*'

# POSIX ACLs for fine-grained file permission control beyond standard ugo/rwx
[[packages]]
name = "acl"
version = "*"

# CCE-88164-9 Host-based firewall
[[packages]]
name = 'firewalld'
version = '*'
