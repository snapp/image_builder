# https://osbuild.org/docs/user-guide/blueprint-reference

version = '1.0.0'

name = 'RHEL-8-DISA-STIG'

# https://public.cyber.mil/stigs
# https://complianceascode.github.io/content-pages/guides/ssg-rhel8-guide-stig.html
description = '''
Red Hat Enterprise Linux (RHEL) 8
Defense Information Systems Agency (DISA) Security Technical Implementation Guide (STIG)
Profile ID:  xccdf_org.ssgproject.content_profile_stig
Benchmark ID:  xccdf_org.ssgproject.content_benchmark_RHEL-8
'''

distro = 'rhel-8'

[customizations]
partitioning_mode = 'lvm'
fips = true

# audit                Enable kernel audit subsystem before any userspace processes start
# audit_backlog_limit  Increase kernel audit event backlog queue size
# fips                 Enforce FIPS 140 approved cryptographic algorithms only
# slub_debug           Poison freed pages at SLUB allocator level
# page_poison          Poison freed pages at Page allocator level
# vsyscall             Disable legacy vsyscall interface
# pti                  Enable Kernel Page Table Isolation
[customizations.kernel]
append = 'audit=1 audit_backlog_limit=8192 fips=1 slub_debug=P page_poison=1 vsyscall=none pti=on'

[customizations.openscap]
profile_id = 'xccdf_org.ssgproject.content_profile_stig'

[customizations.services]
enabled = ['auditd', 'fapolicyd', 'firewalld', 'rngd', 'rsyslog', 'sshd', 'usbguard', 'cloud-preconfig']
disabled = ['autofs', 'debug-shell', 'kdump']
masked = []

[[customizations.disk.partitions]]
type = 'plain'
mountpoint = '/boot'
label = 'boot'
fs_type = 'xfs'
minsize = '1 GiB'

[[customizations.disk.partitions]]
type = 'lvm'
name = 'rootvg'
minsize = '14 GiB'

[[customizations.disk.partitions.logical_volumes]]
name = 'rootlv'
mountpoint = '/'
label = 'root'
fs_type = 'xfs'
minsize = '4 GiB'

[[customizations.disk.partitions.logical_volumes]]
name = 'homelv'
mountpoint = '/home'
label = 'home'
fs_type = 'xfs'
minsize = '1 GiB'

[[customizations.disk.partitions.logical_volumes]]
name = 'tmplv'
mountpoint = '/tmp'
label = 'tmp'
fs_type = 'xfs'
minsize = '1 GiB'

[[customizations.disk.partitions.logical_volumes]]
name = 'varlv'
mountpoint = '/var'
label = 'var'
fs_type = 'xfs'
minsize = '2 GiB'

[[customizations.disk.partitions.logical_volumes]]
name = 'var_loglv'
mountpoint = '/var/log'
label = 'varlog'
fs_type = 'xfs'
minsize = '1 GiB'

[[customizations.disk.partitions.logical_volumes]]
name = 'var_log_auditlv'
mountpoint = '/var/log/audit'
label = 'varlogaudit'
fs_type = 'xfs'
minsize = '1 GiB'

[[customizations.disk.partitions.logical_volumes]]
name = 'var_tmplv'
mountpoint = '/var/tmp'
label = 'vartmp'
fs_type = 'xfs'
minsize = '1 GiB'

[[customizations.disk.partitions.logical_volumes]]
fs_type = 'swap'
minsize = '512 MiB'

# Compliance tooling for Security Content Automation Protocol (SCAP) remediation
[[packages]]
name = 'openscap-scanner'
version = '*'
[[packages]]
name = 'scap-security-guide'
version = '*'

# Identity Management (IdM) tooling
[[packages]]
name = 'ipa-client'
version = '*'
[[packages]]
name = 'oddjob'
version = '*'
[[packages]]
name = 'oddjob-mkhomedir'
version = '*'

# POSIX ACLs for fine-grained file permission control beyond standard ugo/rwx
[[packages]]
name = "acl"
version = "*"

# CCE-90843-4 Filesystem Integrity
[[packages]]
name = 'aide'
version = '*'

# CCE-84224-5 File Access Policy Daemon
[[packages]]
name = 'fapolicyd'
version = '*'

# CCE-87036-0 Mail server for sending email
[[packages]]
name = 'mailx'
version = '*'

# CCE-83595-9 Multifactor Authentication
[[packages]]
name = 'opensc'
version = '*'

# CCE-85984-3 Mail server for sending email
[[packages]]
name = 'postfix'
version = '*'

# CCE-82968-9 Hardware random number generator tools
[[packages]]
name = 'rng-tools'
version = '*'

# CCE-83987-8 rsyslog daemon TLS support
[[packages]]
name = 'rsyslog-gnutls'
version = '*'

# CCE-80644-8 Console screen lock support
[[packages]]
name = 'tmux'
version = '*'

# CCE-84203-9 Rogue USB device protection
[[packages]]
name = 'usbguard'
version = '*'

# CCE-88164-9 Host-based firewall
[[packages]]
name = 'firewalld'
version = '*'

# open-vm-tools traditional Guest OS Customization (GOSC) requires Perl
[[packages]]
name = 'perl-interpreter'
version = '*'

# VMware cloud-init and userdata templates for provisioning
# https://docs.redhat.com/en/documentation/red_hat_satellite/6.19/html-single/provisioning_hosts/index#Using_VMware_Cloud_Init_and_Userdata_Templates_for_Provisioning_vmware-provisioning
# NOTE - Requires On-Premise Image Builder for file templating

# Cloud-Init: Ensure Satellite certificate is trusted before dynamically include Satellite CloudInit template
# NOTE - Replace sat-1.lab.example.org with the FQDN of your Satellite Server
[[customizations.files]]
path = '/etc/systemd/system/cloud-preconfig.service'
mode = '0644'
user = 'root'
group = 'root'
data = '''
[Unit]
Description=Update system trust store to include Red Hat Satellite CA certificate
ConditionPathExists=!/etc/pki/ca-trust/source/anchors/katello-server-ca.pem
Wants=NetworkManager-wait-online.service
After=NetworkManager-wait-online.service
Before=cloud-init.service

[Service]
Type=oneshot
ExecStart=/usr/bin/bash -c 'for i in {1..30}; do /usr/bin/curl -fsS -k https://sat-1.lab.example.org/pub/katello-server-ca.crt -o /etc/pki/ca-trust/source/anchors/katello-server-ca.pem && exit 0; sleep 2; done; exit 1'
ExecStartPost=/usr/bin/update-ca-trust extract
RemainAfterExit=no

[Install]
WantedBy=cloud-init.target
'''

# Cloud-Init: Dynamically include Satellite CloudInit template
# NOTE - Replace sat-1.lab.example.org with the FQDN of your Satellite Server
[[customizations.files]]
path = '/etc/cloud/cloud.cfg.d/10_datasource.cfg'
mode = '0644'
user = 'root'
group = 'root'
data = '''
datasource_list: [NoCloud]
datasource:
  NoCloud:
    seedfrom: https://sat-1.lab.example.org/userdata/
'''

# Cloud-Init: Disable cloud-init management of network configuration (performed by open-vm-tools)
[[customizations.files]]
path = '/etc/cloud/cloud.cfg.d/01_network.cfg'
mode = '0644'
user = 'root'
group = 'root'
data = '''
network:
  config: disabled
'''

# Cloud-Init: Reduce active module set
[[customizations.files]]
path = '/etc/cloud/cloud.cfg'
mode = '0644'
user = 'root'
group = 'root'
data = '''
cloud_init_modules:
  - bootcmd
  - ssh

cloud_config_modules:
  - runcmd

cloud_final_modules:
  - scripts-per-once
  - scripts-per-boot
  - scripts-per-instance
  - scripts-user
  - phone-home

system_info:
  distro: rhel
  paths:
    cloud_dir: /var/lib/cloud
    templates_dir: /etc/cloud/templates
  ssh_svcname: sshd
'''

[[customizations.files]]
path = '/etc/vmware-tools/tools.conf'
mode = '0644'
user = 'root'
group = 'root'
data = '''
# Increase timeout to 10m to allow time for the Satellite Cloud-Init template to execute
[deployPkg]
wait-cloudinit-timeout = 600
'''

[[customizations.directories]]
path = '/etc/systemd/system/cloud-init.service.d'
mode = '0755'
user = 'root'
group = 'root'

[[customizations.files]]
path = '/etc/systemd/system/cloud-init.service.d/10-wait-for-vmware.conf'
mode = '0644'
user = 'root'
group = 'root'
data = '''
[Unit]
Description=Delay cloud-init until open-vm-tools is finished setting up network
ConditionPathExists=!/run/vmware-imc/cust.cfg
'''

[[customizations.directories]]
path = '/etc/systemd/system/getty@.service.d'
mode = '0755'
user = 'root'
group = 'root'

[[customizations.files]]
path = '/etc/systemd/system/getty@.service.d/wait-for-cloud-init.conf'
mode = '0644'
user = 'root'
group = 'root'
data = '''
[Unit]
Description=Delay console login prompt until cloud-init has finished
After=cloud-init.target
'''
